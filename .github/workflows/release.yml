name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Require credentials before publishing a tagged release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          required=(
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID
            AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret $name"
              exit 1
            fi
          done

  build:
    needs: release-readiness
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # Code signing turns on once its secrets exist (README, "Code signing");
      # without them the builds are unsigned. Only variables that are set are
      # exported: an empty APPLE_CERTIFICATE would still make the bundler sign.
      - name: macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__END__"; echo "${!name}"; echo "__END__"; } >> "$GITHUB_ENV"
            fi
          done
          [ -n "$APPLE_CERTIFICATE" ] && echo "Signing with $APPLE_SIGNING_IDENTITY" || echo "No certificate: unsigned build"

      - name: Windows signing (Azure Trusted Signing)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_SECRET" ]; then
            echo "No Azure credentials: unsigned build"
            exit 0
          fi
          cargo install trusted-signing-cli --locked
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          command="trusted-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d MDViewer %1"
          jq -n --arg cmd "$command" '{bundle: {windows: {signCommand: $cmd}}}' > src-tauri/signing.conf.json
          echo "SIGNING_ARGS=--config src-tauri/signing.conf.json" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages the in-app updater downloads (README, "Updates")
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: MDViewer ${{ github.ref_name }}
          releaseBody: |
            MDViewer 1.1.0 adds a searchable Files column with project agent files,
            a collapsible Global agent files root, file associations for Markdown,
            and improvements to opening folders, menus, search, and file access.

            This is the first release with in-app updates. See CHANGELOG.md for
            the full list of changes and README.md for installation instructions.
          releaseDraft: true
          prerelease: false
          # Written by the updater-manifest job instead: jobs updating it in
          # parallel can drop each other's platforms
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ env.SIGNING_ARGS }}

      - name: Upload installers (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mdviewer-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  # latest.json, read by the in-app updater from the latest release:
  # each platform's update package and its signature
  updater-manifest:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" --pattern '*.sig'
          python3 - <<'EOF'
          import datetime, json, os, urllib.parse

          base = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{os.environ['TAG']}/"

          def package(suffix):
              sigs = [f for f in os.listdir('.') if f.endswith(suffix + '.sig')]
              if len(sigs) != 1:
                  raise SystemExit(f'expected one *{suffix}.sig, found {sigs}')
              return {
                  'signature': open(sigs[0]).read().strip(),
                  'url': base + urllib.parse.quote(sigs[0].removesuffix('.sig')),
              }

          manifest = {
              'version': os.environ['TAG'].removeprefix('v'),
              'notes': 'See CHANGELOG.md for what changed.',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {
                  'darwin-aarch64': package('_aarch64.app.tar.gz'),
                  'darwin-x86_64': package('_x64.app.tar.gz'),
                  'windows-x86_64': package('-setup.exe'),
                  'linux-x86_64': package('.AppImage'),
              },
          }
          json.dump(manifest, open('latest.json', 'w'), indent=2)
          EOF
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Require the updater key before publishing a tagged release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Installer signing is optional: 1.1.0 ships ad-hoc signed on macOS and
        # unsigned on Windows (docs/RELEASE_1.1.0.md). Without the updater key
        # installed copies could never update, so that one is required
        run: |
          required=(TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret $name"
              exit 1
            fi
          done

  build:
    needs: release-readiness
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Clear cached bundle output
        shell: bash
        run: rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"

      # Code signing turns on once its secrets exist (README, "Code signing");
      # without them the builds are unsigned. Only variables that are set are
      # exported: an empty APPLE_CERTIFICATE would still make the bundler sign.
      - name: macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__END__"; echo "${!name}"; echo "__END__"; } >> "$GITHUB_ENV"
            fi
          done
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Signing with $APPLE_SIGNING_IDENTITY"
          else
            # Ad-hoc signature: without one the bundle's linker signature doesn't
            # cover its resources, and a downloaded copy reports itself damaged
            echo "No certificate: ad-hoc signed build"
            echo '{"bundle": {"macOS": {"signingIdentity": "-"}}}' > src-tauri/signing.conf.json
            echo "SIGNING_ARGS=--config src-tauri/signing.conf.json" >> "$GITHUB_ENV"
          fi

      - name: Windows signing (Azure Trusted Signing)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_SECRET" ]; then
            echo "No Azure credentials: unsigned build"
            exit 0
          fi
          cargo install trusted-signing-cli --locked
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          command="trusted-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE -d MDViewer %1"
          jq -n --arg cmd "$command" '{bundle: {windows: {signCommand: $cmd}}}' > src-tauri/signing.conf.json
          echo "SIGNING_ARGS=--config src-tauri/signing.conf.json" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages the in-app updater downloads (README, "Updates")
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: MDViewer ${{ github.ref_name }}
          releaseBody: |
            MDViewer 1.1.0 adds a searchable Files column with project agent files,
            a collapsible Global agent files root, file associations for Markdown,
            and improvements to opening folders, menus, search, and file access.

            This is the first release with in-app updates. See CHANGELOG.md for
            the full list of changes and README.md for installation instructions.

            Install with `brew install --cask lambda-house/tap/mdviewer`, from the
            apt/dnf repository at https://lambda-house.github.io/mdviewer-packages/,
            or from the AUR (`mdviewer-bin`). SHA256SUMS lists every file's checksum.

            The installers are not code-signed yet. macOS: open MDViewer once, then
            click "Open Anyway" in System Settings > Privacy & Security. Windows: on
            the SmartScreen warning, click "More info" and then "Run anyway".
          releaseDraft: true
          prerelease: false
          # Written by the updater-manifest job instead: jobs updating it in
          # parallel can drop each other's platforms
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ env.SIGNING_ARGS }}

      - name: Upload installers (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mdviewer-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
          if-no-files-found: ignore

  # latest.json, read by the in-app updater from the latest release:
  # each platform's update package and its signature
  updater-manifest:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" --pattern '*.sig'
          python3 - <<'EOF'
          import datetime, json, os, urllib.parse

          base = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{os.environ['TAG']}/"

          def package(suffix):
              sigs = [f for f in os.listdir('.') if f.endswith(suffix + '.sig')]
              if len(sigs) != 1:
                  raise SystemExit(f'expected one *{suffix}.sig, found {sigs}')
              return {
                  'signature': open(sigs[0]).read().strip(),
                  'url': base + urllib.parse.quote(sigs[0].removesuffix('.sig')),
              }

          manifest = {
              'version': os.environ['TAG'].removeprefix('v'),
              'notes': 'See CHANGELOG.md for what changed.',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {
                  'darwin-aarch64': package('_aarch64.app.tar.gz'),
                  'darwin-x86_64': package('_x64.app.tar.gz'),
                  'windows-x86_64': package('-setup.exe'),
                  'linux-x86_64': package('.AppImage'),
              },
          }
          json.dump(manifest, open('latest.json', 'w'), indent=2)
          EOF
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      # Lets users check unsigned downloads: SHA256SUMS, and a provenance
      # attestation per file (`gh attestation verify <file> --repo <repo>`)
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern '*' --skip-existing
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

      - uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

  # Package channels, updated once the release is public. Each one skips with
  # a notice while its secrets are missing (README, "Package channels")
  homebrew:
    needs: updater-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the cask in lambda-house/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::No HOMEBREW_TAP_DEPLOY_KEY: the tap was not updated"
            exit 0
          fi
          version=${TAG#v}
          gh release download "$TAG" --pattern SHA256SUMS
          sha() { awk -v f="$1" '$2 == f { print $1 }' SHA256SUMS | grep .; }
          sha_arm=$(sha "MDViewer_${version}_aarch64.dmg")
          sha_intel=$(sha "MDViewer_${version}_x64.dmg")
          cask=$(packaging/homebrew/cask.sh "$version" "$sha_arm" "$sha_intel")

          install -m 600 /dev/null "$RUNNER_TEMP/key" && echo "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:lambda-house/homebrew-tap.git tap
          echo "$cask" > tap/Casks/mdviewer.rb
          cd tap
          git add Casks/mdviewer.rb
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "mdviewer $version"
          git push -q origin HEAD

  linux-repo:
    needs: updater-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the packages to lambda-house/mdviewer-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DEPLOY_KEY: ${{ secrets.PACKAGES_DEPLOY_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::No PACKAGES_DEPLOY_KEY or PACKAGES_GPG_PRIVATE_KEY: the apt/dnf repository was not updated"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c rpm > /dev/null
          echo "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          export GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gh release download "$TAG" --pattern '*.deb' --pattern '*.rpm' --dir incoming

          install -m 600 /dev/null "$RUNNER_TEMP/key" && echo "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:lambda-house/mdviewer-packages.git site
          packaging/linux-repo/build.sh site incoming
          cd site
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "MDViewer ${TAG#v}"
          git push -q origin HEAD

  aur:
    needs: updater-manifest
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Update mdviewer-bin on the AUR
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::notice::No AUR_SSH_PRIVATE_KEY: the AUR package was not updated"
            exit 0
          fi
          set -euo pipefail
          pacman -Sy --noconfirm --needed git openssh > /dev/null
          version=${TAG#v}
          sha_deb=$(curl -fsSL "https://github.com/$REPO/releases/download/$TAG/SHA256SUMS" \
            | awk -v f="MDViewer_${version}_amd64.deb" '$2 == f { print $1 }' | grep .)
          sha_license=$(curl -fsSL "https://raw.githubusercontent.com/$REPO/$TAG/LICENSE" | sha256sum | cut -d' ' -f1)

          install -m 600 /dev/null /tmp/aur_key && echo "$AUR_KEY" > /tmp/aur_key
          export GIT_SSH_COMMAND="ssh -i /tmp/aur_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q ssh://aur@aur.archlinux.org/mdviewer-bin.git aur
          packaging/aur/PKGBUILD.sh "$version" "$sha_deb" "$sha_license" > aur/PKGBUILD
          # makepkg refuses to run as root
          useradd -m builder
          install -d -o builder /tmp/srcinfo && cp aur/PKGBUILD /tmp/srcinfo/
          su builder -c 'cd /tmp/srcinfo && makepkg --printsrcinfo' > aur/.SRCINFO
          cd aur
          git add PKGBUILD .SRCINFO
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "mdviewer-bin $version"
          git push -q origin HEAD:master

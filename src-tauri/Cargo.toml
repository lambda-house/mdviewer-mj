[package]
name = "mdviewer"
version = "1.1.1"
description = "Markdown Document Viewer"
authors = ["Lambda House"]
license = "MIT"
repository = "https://github.com/lambda-house/mdviewer-mj"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
notify = { version = "6.0", default-features = false, features = ["macos_fsevent"] }
dirs = "5.0"
chrono = "0.4"
encoding_rs = "0.8"
dunce = "1.0"
tauri-plugin-updater = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib-sys = "0.22.9"
glib = "0.22.10"
gobject-sys = "0.22.9"

[features]
sessions-preview = []
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
